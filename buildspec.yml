version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python --version
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Running unit tests..."
      - python -m pytest -v

artifacts:
  files:
    - app.py
    - requirements.txt
    - buildspec.yml
    - tests/**/*